<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrasi — AéSse Beauty</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        babyblue: {
                            50: "#F1F8FD",
                            100: "#E2F1FB",
                            200: "#C4E3F7",
                            300: "#A5D5F2",
                            400: "#7FC4EC",
                            500: "#5FB0E2"
                        },
                        butter: {
                            50: "#FEFAF0",
                            100: "#FDF3DB",
                            200: "#FBE9B8",
                            300: "#F7DD8F"
                        },
                        softpink: {
                            50: "#FEF2F7",
                            100: "#FDE6F0",
                            200: "#FBC1DC",
                            300: "#F6A0C6",
                            400: "#EF86B2"
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="min-h-screen bg-babyblue-50 font-sans text-slate-700">

    <main class="flex min-h-screen items-center justify-center px-4 py-10">
        <section class="w-full max-w-3xl rounded-3xl bg-white/90 p-6 shadow-xl shadow-babyblue-200/40 ring-1 ring-babyblue-100 backdrop-blur sm:p-10">

            <div class="mb-8 text-center">
                <div class="mb-5 flex items-center justify-center gap-2">
                    <span class="h-2.5 w-2.5 rounded-full bg-babyblue-400"></span>
                    <span class="h-2.5 w-2.5 rounded-full bg-butter-300"></span>
                    <span class="h-2.5 w-2.5 rounded-full bg-softpink-300"></span>
                </div>
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-babyblue-400 text-2xl font-bold text-white shadow-lg shadow-softpink-200/50 ring-4 ring-butter-100">
                    Aé
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-800 sm:text-3xl">
                    Create Your
                    <span class="text-softpink-400">AéSse Beauty</span>
                    Account
                </h1>
                <p class="mx-auto mt-3 max-w-md text-sm leading-relaxed text-slate-500 sm:text-base">
                    Welcome to AéSse Beauty! Let's Join Us.
                </p>
                <div class="mx-auto mt-6 h-1 w-16 rounded-full bg-butter-300"></div>
            </div>

            <form id="registerForm" action="dashboard.html" method="get" novalidate class="space-y-5">

                <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">

                    <div>
                        <label for="username" class="block text-sm font-semibold text-slate-700">Username</label>
                        <input type="text" id="username" name="username" placeholder="ex : karina.yu"
                            class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm text-slate-700 placeholder:text-slate-300 shadow-sm outline-none transition duration-200 focus:ring-2 focus:ring-babyblue-200 focus:ring-offset-1" />
                        <p id="username-error" class="mt-1.5 hidden text-xs font-medium text-softpink-400"></p>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
                        <div class="relative">
                            <input type="password" id="password" name="password" placeholder="Minimal 8 karakter"
                                class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-2.5 pr-16 text-sm text-slate-700 placeholder:text-slate-300 shadow-sm outline-none transition duration-200 focus:ring-2 focus:ring-babyblue-200 focus:ring-offset-1" />
                            <button type="button" id="toggle-password"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-babyblue-500 transition hover:text-babyblue-400">
                                Lihat
                            </button>
                        </div>
                        <p id="password-error" class="mt-1.5 hidden text-xs font-medium text-softpink-400"></p>
                    </div>

                    <div>
                        <label for="nama" class="block text-sm font-semibold text-slate-700">Full Name</label>
                        <input type="text" id="nama" name="nama" placeholder="ex : Karina Yu"
                            class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm text-slate-700 placeholder:text-slate-300 shadow-sm outline-none transition duration-200 focus:ring-2 focus:ring-babyblue-200 focus:ring-offset-1" />
                        <p id="nama-error" class="mt-1.5 hidden text-xs font-medium text-softpink-400"></p>
                    </div>

                    <div>
                        <label for="tanggalLahir" class="block text-sm font-semibold text-slate-700">Date of Birth</label>
                        <input type="date" id="tanggalLahir" name="tanggalLahir"
                            class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm text-slate-700 shadow-sm outline-none transition duration-200 focus:ring-2 focus:ring-babyblue-200 focus:ring-offset-1" />
                        <p id="tanggalLahir-error" class="mt-1.5 hidden text-xs font-medium text-softpink-400"></p>
                    </div>

                    <div class="sm:col-span-2">
                        <label for="alamat" class="block text-sm font-semibold text-slate-700">Address</label>
                        <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap tempat tinggalmu"
                            class="mt-1.5 w-full resize-none rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm text-slate-700 placeholder:text-slate-300 shadow-sm outline-none transition duration-200 focus:ring-2 focus:ring-babyblue-200 focus:ring-offset-1"></textarea>
                        <p id="alamat-error" class="mt-1.5 hidden text-xs font-medium text-softpink-400"></p>
                    </div>

                    <div class="sm:col-span-2">
                        <label for="nomorTelepon" class="block text-sm font-semibold text-slate-700">Phone Number</label>
                        <input type="tel" id="nomorTelepon" name="nomorTelepon" placeholder="Wajib diawali dengan 62, ex: 6281234567890"
                            class="mt-1.5 w-full rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm text-slate-700 placeholder:text-slate-300 shadow-sm outline-none transition duration-200 focus:ring-2 focus:ring-babyblue-200 focus:ring-offset-1" />
                        <p id="nomorTelepon-error" class="mt-1.5 hidden text-xs font-medium text-softpink-400"></p>
                    </div>

                </div>

                <button type="submit" id="submit-button"
                    class="mt-2 w-full rounded-full bg-softpink-400 px-8 py-3.5 text-sm font-bold tracking-wide text-white shadow-lg shadow-softpink-200/50 transition duration-300 hover:bg-softpink-300 hover:shadow-xl hover:shadow-softpink-200/70 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.99]">
                    Create Account
                </button>

            </form>

            <p class="mt-6 text-center text-xs text-slate-400">
                By signing up, you agree to AéSse Beauty's terms and conditions.
            </p>

        </section>
    </main>

    <script src="validasi_input.js"></script>
</body>
</html>
