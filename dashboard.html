<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — AéSse Beauty</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        babyblue: {
                            50: "#F1F8FD",
                            100: "#E2F1FB",
                            200: "#C4E3F7",
                            300: "#A5D5F2",
                            400: "#7FC4EC",
                            500: "#5FB0E2"
                        },
                        butter: {
                            50: "#FEFAF0",
                            100: "#FDF3DB",
                            200: "#FBE9B8",
                            300: "#F7DD8F"
                        },
                        softpink: {
                            50: "#FEF2F7",
                            100: "#FDE6F0",
                            200: "#FBC1DC",
                            300: "#F6A0C6",
                            400: "#EF86B2"
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="min-h-screen bg-babyblue-50 font-sans text-slate-700">

    <header class="border-b border-babyblue-100 bg-white/70 backdrop-blur">
        <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-4">
            <div class="flex items-center gap-2">
                <div class="flex h-9 w-9 items-center justify-center rounded-full bg-babyblue-400 text-base font-bold text-white shadow-md shadow-softpink-200/50">
                    Aé
                </div>
                <span class="font-semibold text-babyblue-500">AéSse Beauty</span>
            </div>
            <span class="rounded-full bg-butter-100 px-4 py-1.5 text-xs font-semibold text-amber-600 ring-1 ring-butter-200">Welcome</span>
        </div>
    </header>

    <main class="flex min-h-[calc(100vh-73px)] items-center justify-center px-4 py-10">
        <section class="w-full max-w-lg rounded-3xl bg-white/90 p-8 text-center shadow-xl shadow-babyblue-200/40 ring-1 ring-babyblue-100 backdrop-blur sm:p-12">

            <div class="mb-6 flex items-center justify-center gap-2">
                <span class="h-2.5 w-2.5 rounded-full bg-babyblue-400"></span>
                <span class="h-2.5 w-2.5 rounded-full bg-butter-300"></span>
                <span class="h-2.5 w-2.5 rounded-full bg-softpink-300"></span>
            </div>

            <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-babyblue-400 text-2xl font-bold text-white shadow-lg shadow-softpink-200/50 ring-4 ring-butter-100">
                Aé
            </div>

            <h1 class="text-2xl font-bold tracking-tight text-slate-800 sm:text-3xl">
                Welcome to
                <span class="text-softpink-400">AéSse Beauty</span>
            </h1>

            <div class="mx-auto mt-5 h-1 w-16 rounded-full bg-butter-300"></div>

            <p id="greeting" class="mt-3 text-sm leading-relaxed text-slate-500 sm:text-base"></p>

            <div class="mt-7 rounded-2xl bg-butter-50 p-4 text-sm leading-relaxed text-slate-600 ring-1 ring-butter-100">
                Your account has been successfully created. Enjoy your beauty journey with us!
            </div>

            <a href="register.html"
                class="mt-7 inline-block rounded-full bg-softpink-400 px-8 py-3 text-sm font-bold text-white shadow-lg shadow-softpink-200/50 transition duration-300 hover:bg-softpink-300 hover:shadow-xl hover:shadow-softpink-200/70 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.99]">
                Back to the Registration Page
            </a>

        </section>
    </main>

    <script>
        const nama = localStorage.getItem('aeSseNama');
        const greeting = document.getElementById('greeting');

        greeting.textContent = nama
            ? 'Hello, ' + nama + '!'
            : 'Welcome to AéSse Beauty';
    </script>
</body>
</html>
